# 새로운 유연한 설정 구조 예시
setting:
  name: "PatchTST_NewMenus"
  seed: 42
  device: "auto" # CPU / GPU 자동 선택
  log_level: 3

  plot: false
  save_plot: false
  save_model_best: true
  save_model_final: true

# 모델 설정 - 각 모델 타입별로 파라미터 정의
models:
  # PatchTST 모델 설정들
  PatchTSTRevINSalesHead:
    base_params:  # 모든 PatchTST 변형에 공통으로 적용되는 기본 파라미터
      window_size: 28
      forecast_size: 7
      feature_size: 16
      d_model: 256
      n_heads: 8
      num_layers: 2
      patch_len: 7
      stride: 7
      dropout: 0.2
      exo_proj: true
      exo_scale: 1.0
      max_tokens: 512
    variants:  # 다양한 하이퍼파라미터 조합
      - name: "base"
        params: {}  # base_params 그대로 사용
      - name: "large_model"
        params:
          d_model: 512
          n_heads: 16
      - name: "deep_model"
        params:
          num_layers: 4
          dropout: 0.2
      - name: "small_patch"
        params:
          patch_len: 2
          stride: 1
      - name: "large_patch"
        params:
          patch_len: 7
          stride: 2

# 손실함수 설정 - 각 손실함수별로 파라미터 정의
losses:
  # SMAPE Inspired Loss 설정들
  SMAPEInspiredLoss:
    base_params:  # 기본 파라미터
      target_idx: 0
      epsilon: 0.00000001 # 1e-8의 표기법 사용시 str로 인식(오류!)
      zero_tol: 0.0
      lambda_zero: 0.02
      detach_pred_in_den: true
      zero_penalty: "huber"
      huber_delta: 0.5
      max_zero_share: 0.15
      use_quantile: true
      quantile_q: 0.6
      quantile_weight: 0.2
      quantile_nonzero_only: true
      use_topk: true
      topk_frac: 0.2
      topk_boost: 1.5
      topk_metric: "abs_error"
    variants:
      - name: "base"
        params: {}
      - name: "aggressive_zero_penalty"
        params:
          lambda_zero: 0.05
          max_zero_share: 0.1
          zero_tol: 0.1
      - name: "conservative_zero_penalty"
        params:
          lambda_zero: 0.001
          max_zero_share: 0.2
          zero_tol: 0.5
      - name: "high_topk_boost"
        params:
          topk_frac: 0.15
          topk_boost: 3.0

  # Weighted SMAPE Inspired Loss 설정들
  WeightedSMAPEInspiredLoss:
    base_params:
      target_idx: 0
      store_weights: {1: 3.0, 3: 3.0, 7: 2.0, 8: 2.0}
    variants:
      - name: "base"
        params: {}

# 실험 조합 정의 - 모델과 손실함수 조합
experiments:
  - model_type: "PatchTSTRevINSalesHead"
    model_variant: "base"
    loss_type: "WeightedSMAPEInspiredLoss"
    loss_variant: "base"
    train_params:
      learning_rate: 0.001
      epochs: 50

# 공통 설정들
dataset:
  train_window: 28
  forecast_window: 7
  batch_size: 64
  validation_ratio: 0.05
  sampling_method: "recent"
  num_workers: 15  # CPU 코어 수에 맞게 설정, 코어 수 * (1 ~ 2) 권장
  pin_memory: true # GPU 사용 시 true, GPU 사용 X시 도움 없음
  prefetch_factor: 8 # num_workers의 절반 정도
  persistent_workers: true # GPU 사용 시 true

preprocess:

  # 로그 변환 사용 - 매출수량의 높은 변동성과 제로 인플레이션 문제 해결
  scaling_method: "LogTransform"  # log(x+1) 변환 적용
  scaling_features: [ "sales" ]     # 매출수량에만 적용

  # 인코딩 설정
  encoding_method: "LabelEncoder"
  encoding_features: [ "store_menu", "category", "is_group_menu", "store", "season" ]
  # 아웃라이어 및 데이터 정제
  new_menu_zero_dropper: true
  is_sales: false
  outlier_iqr_replacement: false
  timestamp_ext: true
  lag: false
  rolling_mean: false
  season: true
  is_holiday: true
  zero_streak: false

train:
  # 기본 훈련 설정 (실험별로 오버라이드 가능)
  epochs: 50
  learning_rate: 0.001
  optimizer: "AdamW"
  scheduler: "ReduceLROnPlateau"
  early_stopping: true
  patience: 10
  weight_decay: 0.0001
  gradient_clip: null
  
  # Cross-validation 설정
  use_cross_validation: false  # Cross-validation 사용 여부
  cv_n_splits: 5              # Cross-validation fold 수
  cv_test_size_ratio: 0.2     # 각 fold에서 validation 데이터 비율

postprocess:
  method: "clip_to_mode"
  round_to_int: true