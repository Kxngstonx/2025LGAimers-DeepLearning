# 새로운 유연한 설정 구조 예시
setting:
  name: "20250812_example_config"
  seed: 42
  device: "auto" # CPU / GPU 자동 선택
  log_level: 2

  plot: true
  save_plot: true
  save_model_best: true
  save_model_final: true

# 모델 설정 - 각 모델 타입별로 파라미터 정의
models:
  # PatchTST 모델 설정들
  PatchTSTRevINSalesHead:
    base_params:  # 모든 PatchTST 변형에 공통으로 적용되는 기본 파라미터
      window_size: 28
      forecast_size: 7
      feature_size: 31
      d_model: 256
      n_heads: 8
      num_layers: 2
      patch_len: 3
      stride: 1
      dropout: 0.1
      exo_proj: true
      exo_scale: 1.0
      max_tokens: 512
    variants:  # 다양한 하이퍼파라미터 조합
      - name: "base"
        params: {}  # base_params 그대로 사용
      - name: "large_model"
        params:
          d_model: 512
          n_heads: 16
      - name: "deep_model"
        params:
          num_layers: 4
          dropout: 0.2
      - name: "small_patch"
        params:
          patch_len: 2
          stride: 1
      - name: "large_patch"
        params:
          patch_len: 7
          stride: 2

  # DLinear 모델 설정들
  DLinear:
    base_params:
      window_size: 28
      forecast_size: 7
      kernel_size: 27
      individual: false
      channels: 1
    variants:
      - name: "base"
        params: {}
      - name: "individual"
        params:
          individual: true
      - name: "small_kernel"
        params:
          kernel_size: 7

  # DLinearRevIN 모델 설정들
  DLinearRevIN:
    base_params:
      window_size: 28
      forecast_size: 7
      kernel_size: 27
      individual: false
      channels: 1
    variants:
      - name: "base"
        params: {}

# 손실함수 설정 - 각 손실함수별로 파라미터 정의
losses:
  # SMAPE Inspired Loss 설정들
  SMAPEInspiredLoss:
    base_params:  # 기본 파라미터
      target_idx: 0
      epsilon: 0.00000001 # 1e-8의 표기법 사용시 str로 인식(오류!)
      zero_tol: 0.0
      lambda_zero: 0.02
      detach_pred_in_den: true
      zero_penalty: "huber"
      huber_delta: 0.5
      max_zero_share: 0.15
      use_quantile: true
      quantile_q: 0.6
      quantile_weight: 0.2
      quantile_nonzero_only: true
      use_topk: true
      topk_frac: 0.2
      topk_boost: 1.5
      topk_metric: "abs_error"
    variants:
      - name: "base"
        params: {}
      - name: "aggressive_zero_penalty"
        params:
          lambda_zero: 0.05
          max_zero_share: 0.1
          zero_tol: 0.1
      - name: "conservative_zero_penalty"
        params:
          lambda_zero: 0.001
          max_zero_share: 0.2
          zero_tol: 0.5
      - name: "high_topk_boost"
        params:
          topk_frac: 0.15
          topk_boost: 3.0

  # Target Column Loss 설정들
  TargetColumnLoss:
    base_params:
      target_idx: 0
    variants:
      - name: "base"
        params: {}

# 실험 조합 정의 - 모델과 손실함수 조합
experiments:
#  - model_type: "PatchTSTRevINSalesHead"
#    model_variant: "base"
#    loss_type: "SMAPEInspiredLoss"
#    loss_variant: "base"
#    train_params:
#      learning_rate: 0.0001
#      epochs: 1
#
#  - model_type: "PatchTSTRevINSalesHead"
#    model_variant: "large_model"
#    loss_type: "SMAPEInspiredLoss"
#    loss_variant: "aggressive_zero_penalty"
#    train_params:
#      learning_rate: 0.0005
#      epochs: 1
#
#  - model_type: "DLinear"
#    model_variant: "base"
#    loss_type: "TargetColumnLoss"
#    loss_variant: "base"
#    train_params:
#      learning_rate: 0.001
#      epochs: 1

  - model_type: "DLinear"
    model_variant: "base"
    loss_type: "SMAPEInspiredLoss"
    loss_variant: "base"
    train_params:
      learning_rate: 0.001
      epochs: 1

# 공통 설정들
dataset:
  train_window: 28
  forecast_window: 7
  batch_size: 32
  validation_ratio: 0.2
  num_workers: 4  # CPU 코어 수에 맞게 설정, 코어 수 * (1 ~ 2) 권장
  pin_memory: true # GPU 사용 시 true, GPU 사용 X시 도움 없음
  prefetch_factor: 2 # num_workers의 절반 정도
  persistent_workers: true # GPU 사용 시 true

preprocess:
  timestamp_ext: true
  lag: true
  rolling_mean: true
  season: true
  is_holiday: true
  zero_streak: true

train:
  # 기본 훈련 설정 (실험별로 오버라이드 가능)
  epochs: 50
  learning_rate: 0.001
  optimizer: "AdamW"
  scheduler: "ReduceLROnPlateau"
  early_stopping: true
  patience: 10
  weight_decay: 0.0001
  gradient_clip: null
  
  # Cross-validation 설정
  use_cross_validation: true  # Cross-validation 사용 여부
  cv_n_splits: 5              # Cross-validation fold 수
  cv_test_size_ratio: 0.2     # 각 fold에서 validation 데이터 비율

postprocess:
  method: "clip_to_mode"
  round_to_int: true